syntax = "proto3";

package spooly.v1;

import "google/api/field_behavior.proto";

option go_package = "github.com/spoolysh/spooly/gen/spooly/v1;spoolyv1";

// Address from a From/To/Cc header, as the sender wrote it.
message Address {
  // Empty when not set.
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string address = 2 [(google.api.field_behavior) = REQUIRED];
}
