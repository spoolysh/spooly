syntax = "proto3";

package spooly.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/spoolysh/spooly/gen/spooly/v1;spoolyv1";

service MailboxService {
  // Create a mailbox. Admins only.
  rpc CreateMailbox(CreateMailboxRequest) returns (CreateMailboxResponse) {
    option (google.api.http) = {
      post: "/v1/mailboxes"
      body: "*"
      response_body: "mailbox"
    };
  }

  // List the mailboxes you can see, newest first by ID. A page shorter than
  // limit is the last one.
  rpc ListMailboxes(ListMailboxesRequest) returns (ListMailboxesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/mailboxes"
      response_body: "mailboxes"
    };
  }

  // Get a mailbox by ID or any of its addresses. "local+tag@domain" finds
  // "local@domain".
  rpc GetMailbox(GetMailboxRequest) returns (GetMailboxResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/mailboxes/{id_or_address}"
      response_body: "mailbox"
    };
  }

  // Update a mailbox's name and addresses. Absent fields are left
  // unchanged. Admins only.
  rpc UpdateMailbox(UpdateMailboxRequest) returns (UpdateMailboxResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      patch: "/v1/mailboxes/{id_or_address}"
      body: "*"
      response_body: "mailbox"
    };
  }
}

// A mailbox receives all mail sent to any of its addresses.
message Mailbox {
  // Assigned in order, from 1.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
    }
  ];
  // Lowercased, in order, e.g. ["hello@spooly.sh"]. The first is primary:
  // it's shown for the mailbox. Mail to any of them reaches it.
  repeated string addresses = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];
  // Empty when not set.
  string name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 128
  ];
  google.protobuf.Timestamp created_at = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

message CreateMailboxRequest {
  // In order; the first is primary. Each must not belong to another
  // mailbox.
  repeated string addresses = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        email: true
        max_len: 254
      }
    }
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 128];
}

message CreateMailboxResponse {
  Mailbox mailbox = 1 [(buf.validate.field).required = true];
}

message ListMailboxesRequest {
  // Absent means 50.
  optional int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // ID of the last mailbox from the previous page.
  optional string after = 2 [(buf.validate.field).string.pattern = "^[0-9a-hjkmnp-tv-z]{26}$"];
}

message ListMailboxesResponse {
  repeated Mailbox mailboxes = 1;
}

message GetMailboxRequest {
  // Treated as an address if it contains "@".
  string id_or_address = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "id_or_address"
      message: "must be a mailbox ID or an email address"
      expression: "this.matches('^[0-9a-hjkmnp-tv-z]{26}$') || this.isEmail()"
    }
  }];
}

message GetMailboxResponse {
  Mailbox mailbox = 1 [(buf.validate.field).required = true];
}

message UpdateMailboxRequest {
  // Treated as an address if it contains "@".
  string id_or_address = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "id_or_address"
      message: "must be a mailbox ID or an email address"
      expression: "this.matches('^[0-9a-hjkmnp-tv-z]{26}$') || this.isEmail()"
    }
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 128];
  // Replaces the mailbox's addresses, in order: the first is primary.
  // Each must not belong to another mailbox. Empty leaves them unchanged.
  repeated string addresses = 3 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        email: true
        max_len: 254
      }
    }
  }];
}

message UpdateMailboxResponse {
  Mailbox mailbox = 1 [(buf.validate.field).required = true];
}
