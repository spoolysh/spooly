syntax = "proto3";

package spooly.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";
import "spooly/v1/common.proto";

option go_package = "github.com/spoolysh/spooly/gen/spooly/v1;spoolyv1";

service MessageService {
  // Store an incoming message. Over REST, the body is the raw message
  // (message/rfc822) and other fields go in the query string.
  rpc CreateMessage(stream CreateMessageRequest) returns (CreateMessageResponse) {
    option (google.api.http) = {
      post: "/v1/messages"
      body: "raw"
      response_body: "message"
      additional_bindings: {
        post: "/v1/mailboxes/{mailbox_id_or_address}/messages"
        body: "raw"
        response_body: "message"
      }
    };
    option (gnostic.openapi.v3.operation) = {
      parameters: {
        parameter: {
          name: "mailbox_id_or_address"
          in: "query"
          description: "Mailbox ID or address. Only for POST /v1/messages."
          schema: {
            schema: {type: "string"}
          }
        }
      }
      parameters: {
        parameter: {
          name: "mail_from"
          in: "query"
          description: "SMTP envelope sender (MAIL FROM)."
          schema: {
            schema: {
              type: "string"
              max_length: 254
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "received_at"
          in: "query"
          description: "When the MTA accepted it. Absent means now."
          schema: {
            schema: {
              type: "string"
              format: "date-time"
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "Idempotency-Key"
          in: "header"
          description: "Unique per mailbox, up to 128 bytes. A repeat returns the stored message."
          schema: {
            schema: {
              type: "string"
              max_length: 128
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "folder"
          in: "query"
          description: "The message's folder: inbox, archive, sent, drafts, junk, or trash. Absent means inbox."
          schema: {
            schema: {type: "string"}
          }
        }
      }
      parameters: {
        parameter: {
          name: "labels"
          in: "query"
          description: "The message's labels, repeated for each, such as labels=billing. A plus address adds its tag's label too, if it exists."
          explode: true
          schema: {
            schema: {
              type: "array"
              items: {
                schema_or_reference: {
                  schema: {type: "string"}
                }
              }
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "seen"
          in: "query"
          description: "Read, such as seen=true for mirrored mail that was. Absent means false."
          schema: {
            schema: {type: "boolean"}
          }
        }
      }
      parameters: {
        parameter: {
          name: "answered"
          in: "query"
          description: "Replied to. Absent means false."
          schema: {
            schema: {type: "boolean"}
          }
        }
      }
      parameters: {
        parameter: {
          name: "flagged"
          in: "query"
          description: "Starred. Absent means false."
          schema: {
            schema: {type: "boolean"}
          }
        }
      }
      parameters: {
        parameter: {
          name: "draft"
          in: "query"
          description: "Not finished. Absent means false."
          schema: {
            schema: {type: "boolean"}
          }
        }
      }
      parameters: {
        parameter: {
          name: "forwarded"
          in: "query"
          description: "Forwarded. Absent means false."
          schema: {
            schema: {type: "boolean"}
          }
        }
      }
      request_body: {
        request_body: {
          required: true
          content: {
            additional_properties: {
              name: "message/rfc822"
              value: {
                schema: {
                  schema: {
                    type: "string"
                    format: "binary"
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Get a message. Its headers and parts have their own methods.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages/{id}"
      response_body: "message"
    };
  }

  // List messages, as summaries, newest received first. A page shorter
  // than limit is the last one. Get a message for all of it.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages"
      additional_bindings: {get: "/v1/mailboxes/{mailbox_id_or_address}/messages"}
    };
  }

  // Update a message's folder, labels, and flags. Absent fields are left
  // unchanged. Moving it to the archive archives a message;
  // setting seen marks it read.
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      patch: "/v1/messages/{id}"
      body: "*"
      response_body: "message"
    };
  }

  // Delete a message for good, for everyone with access to its mailbox; to
  // move a message to the trash, move it to the trash folder instead. Until
  // it's expunged, an admin can restore it; then its raw source is gone.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {delete: "/v1/messages/{id}"};
  }

  // Get a message's header fields, read from its raw source.
  rpc GetMessageHeaders(GetMessageHeadersRequest) returns (GetMessageHeadersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages/{id}/headers"
      response_body: "headers"
    };
  }

  // Get a part's content, decoded: a body or an attachment. Over REST, the
  // body is the part, with its content type (text decoded to UTF-8) and a
  // Content-Disposition naming the file. Only the part is read from the raw
  // source.
  rpc GetMessagePart(GetMessagePartRequest) returns (stream GetMessagePartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages/{id}/parts/{index}"
      response_body: "content"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "The part, decoded."
              content: {
                additional_properties: {
                  name: "application/octet-stream"
                  value: {
                    schema: {
                      schema: {
                        type: "string"
                        format: "binary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Get a message's raw source, or with offset and length, just those bytes,
  // such as its header block.
  rpc GetMessageRaw(GetMessageRawRequest) returns (stream GetMessageRawResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages/{id}/raw"
      response_body: "raw"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "Raw RFC 5322 source."
              content: {
                additional_properties: {
                  name: "message/rfc822"
                  value: {
                    schema: {
                      schema: {
                        type: "string"
                        format: "binary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // List a mailbox's messages in a folder or with a label in the order they
  // came there, each with its seq there, for sync clients: an IMAP bridge
  // uses seqs as UIDs. Junk and trash show only in their own folders. A
  // page shorter than limit is the last one. Over Connect or gRPC only: not
  // mapped to REST.
  rpc ListMessagesBySeq(ListMessagesBySeqRequest) returns (ListMessagesBySeqResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Update several messages at once, as UpdateMessage does each. Messages
  // that don't exist, or that the caller can't see, are skipped. Over
  // Connect or gRPC only, for now: not mapped to REST.
  rpc BatchUpdateMessages(BatchUpdateMessagesRequest) returns (BatchUpdateMessagesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // List what changed in a mailbox since a cursor: messages created,
  // updated, and deleted, each once. Without a cursor, it returns just the
  // cursor to start from. Events are the organization's, so the cursor moves
  // past other mailboxes' too. Pass the response's cursor next time; while
  // has_more, there are more right away. Events are kept for a while, then
  // pruned: a cursor from before fails with FAILED_PRECONDITION, and the
  // mailbox has to be synced again. For sync clients, over Connect or gRPC
  // only: not mapped to REST.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// A stored message. The fields from its header, its snippet, and its parts
// are parsed from the raw source.
message Message {
  // A ULID, lowercase: IDs sort by when messages were stored.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
    }
  ];
  string mailbox_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
    }
  ];

  // Where the message is: exactly one of inbox, archive, sent, drafts, junk,
  // and trash. New messages are in the inbox.
  string folder = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      in: [
        "inbox",
        "archive",
        "sent",
        "drafts",
        "junk",
        "trash"
      ]
    }
  ];
  // Label names: what the message is about, such as "billing". A message
  // can have several, and keeps them in any folder.
  repeated string labels = 4 [(google.api.field_behavior) = REQUIRED];

  // Flags: the message's state, wherever it is. In IMAP's order, as its
  // \Seen, \Answered, \Flagged, \Draft, and $Forwarded, and named as JMAP's
  // keywords. New messages have none.

  // Read. The API never sets it on its own.
  bool seen = 5 [(google.api.field_behavior) = REQUIRED];
  // Replied to.
  bool answered = 6 [(google.api.field_behavior) = REQUIRED];
  // Starred.
  bool flagged = 7 [(google.api.field_behavior) = REQUIRED];
  // Not finished, as mail clients mark the drafts they save.
  bool draft = 8 [(google.api.field_behavior) = REQUIRED];
  // Forwarded to someone.
  bool forwarded = 9 [(google.api.field_behavior) = REQUIRED];

  // SMTP envelope sender (MAIL FROM): the bounce address, not the From or
  // Sender header. Empty for bounces.
  string mail_from = 10 [(google.api.field_behavior) = REQUIRED];
  // SMTP envelope recipient (RCPT TO) it was delivered to, e.g.
  // "hello+news@spooly.sh". The mailbox's address when created by mailbox ID.
  string rcpt_to = 11 [(google.api.field_behavior) = REQUIRED];

  // First address of the From header. Empty when there's none.
  Address from = 12 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  repeated Address to = 13 [(google.api.field_behavior) = REQUIRED];
  repeated Address cc = 14 [(google.api.field_behavior) = REQUIRED];
  string subject = 15 [(google.api.field_behavior) = REQUIRED];
  // Date header, as claimed by the sender. Absent when missing or invalid.
  optional google.protobuf.Timestamp date = 16;
  // Start of the text body, for list views.
  string snippet = 17 [(google.api.field_behavior) = REQUIRED];

  // Raw size in bytes.
  int64 size = 18 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gte = 0
  ];
  // How many attachments it has: its parts but the bodies.
  int32 attachments = 19 [(google.api.field_behavior) = REQUIRED];
  // Every part, in the order of the raw source. A part's index here is its
  // index for GetMessagePart. The text body is the first text/plain part
  // whose disposition isn't "attachment" and that has no name; the HTML
  // body, the same for text/html. The rest are attachments.
  repeated MessagePart parts = 20 [(google.api.field_behavior) = REQUIRED];

  // When the MTA accepted it.
  google.protobuf.Timestamp received_at = 21 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// A header field: its name as written, such as "List-Id", and its value
// unfolded but not decoded, so encoded words like =?utf-8?B?...?= stay as
// they are.
message MessageHeader {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string value = 2 [(google.api.field_behavior) = REQUIRED];
}

// A MIME body part, other than a multipart: a body, an attachment, an
// inline image, or an alternative such as a calendar invite. Names follow
// JMAP's EmailBodyPart (RFC 8621).
message MessagePart {
  // The media type from Content-Type, such as "application/pdf".
  string type = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  // The Content-Disposition type, such as "inline" or "attachment".
  // Empty when not set.
  string disposition = 2 [(google.api.field_behavior) = REQUIRED];
  // The file name, decoded. Empty when not set.
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  // The Content-ID, without angle brackets, that the HTML body refers to
  // as cid:..., e.g. for an inline image. Empty when not set.
  string cid = 4 [(google.api.field_behavior) = REQUIRED];
  // Decoded, in bytes.
  int64 size = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gte = 0
  ];
}

// Over Connect/gRPC, the first message carries all fields, later ones
// only raw chunks. To make retries safe, send an Idempotency-Key request
// header, unique per mailbox and up to 128 bytes: a repeat returns the
// stored message.
message CreateMessageRequest {
  // Treated as an address if it contains "@"; "local+tag@domain" finds
  // "local@domain". Stored as the message's rcpt_to. Required in the first
  // message.
  string mailbox_id_or_address = 1 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    cel: {
      id: "mailbox_id_or_address"
      message: "must be a mailbox ID or an email address"
      expression: "this.matches('^[0-9a-hjkmnp-tv-z]{26}$') || this.isEmail()"
    }
  }];
  // Raw RFC 5322 source.
  google.api.HttpBody raw = 2 [(buf.validate.field).required = true];
  // SMTP envelope sender (MAIL FROM), e.g. Cloudflare's message.from.
  string mail_from = 3 [(buf.validate.field).string.max_len = 254];
  // Absent means now.
  optional google.protobuf.Timestamp received_at = 4;
  // The message's folder, such as "sent" for mirrored sent mail. Empty
  // means inbox, as for new mail.
  string folder = 5 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    string: {
      in: [
        "inbox",
        "archive",
        "sent",
        "drafts",
        "junk",
        "trash"
      ]
    }
  }];
  // The message's labels. Each must exist. Mail to a plus address, such as
  // hello+billing@spooly.sh, also gets its tag's label if there is one.
  repeated string labels = 6 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  }];
  // The message's flags, such as seen for mirrored mail that was read.
  // Absent means unset, as for new mail.
  bool seen = 7;
  bool answered = 8;
  bool flagged = 9;
  bool draft = 10;
  bool forwarded = 11;
}

message CreateMessageResponse {
  Message message = 1 [(buf.validate.field).required = true];
}

message GetMessageRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
  }];
}

message GetMessageResponse {
  Message message = 1 [(buf.validate.field).required = true];
}

message ListMessagesRequest {
  // Treated as an address if it contains "@". Absent means all mailboxes.
  optional string mailbox_id_or_address = 1 [(buf.validate.field).cel = {
    id: "mailbox_id_or_address"
    message: "must be a mailbox ID or an email address"
    expression: "this.matches('^[0-9a-hjkmnp-tv-z]{26}$') || this.isEmail()"
  }];
  // Absent means 50.
  optional int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];
  // The ID of the last message on the previous page.
  optional string after = 3 [(buf.validate.field).string.pattern = "^[0-9a-hjkmnp-tv-z]{26}$"];
  // Only list messages in this folder. Absent means every folder but junk
  // and trash, as Gmail's All Mail: their mail is listed only under them.
  optional string folder = 4 [(buf.validate.field).string = {
    in: [
      "inbox",
      "archive",
      "sent",
      "drafts",
      "junk",
      "trash"
    ]
  }];
  // Only list messages with this label.
  optional string label = 5 [(buf.validate.field).string = {
    pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
    max_len: 64
  }];
  // Only list messages with seen set to this: false lists unread mail.
  optional bool seen = 6;
  // Only list messages with flagged set to this: true lists starred mail.
  optional bool flagged = 7;
}

message ListMessagesResponse {
  repeated MessageSummary messages = 1;
}

// What a list shows of a message. Get it for its recipients, envelope, and
// parts.
message MessageSummary {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string mailbox_id = 2 [(google.api.field_behavior) = REQUIRED];
  string folder = 3 [(google.api.field_behavior) = REQUIRED];
  repeated string labels = 4 [(google.api.field_behavior) = REQUIRED];

  bool seen = 5 [(google.api.field_behavior) = REQUIRED];
  bool answered = 6 [(google.api.field_behavior) = REQUIRED];
  bool flagged = 7 [(google.api.field_behavior) = REQUIRED];
  bool draft = 8 [(google.api.field_behavior) = REQUIRED];
  bool forwarded = 9 [(google.api.field_behavior) = REQUIRED];

  // First address of the From header.
  Address from = 10 [(google.api.field_behavior) = REQUIRED];
  string subject = 11 [(google.api.field_behavior) = REQUIRED];
  // Date header, as claimed by the sender. Absent when missing or invalid.
  optional google.protobuf.Timestamp date = 12;
  // Start of the text body.
  string snippet = 13 [(google.api.field_behavior) = REQUIRED];
  // Raw size in bytes.
  int64 size = 14 [(google.api.field_behavior) = REQUIRED];
  // How many attachments it has: its parts but the bodies.
  int32 attachments = 15 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp received_at = 16 [(google.api.field_behavior) = REQUIRED];
}

message UpdateMessageRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
  }];
  // Moves the message to this folder.
  optional string folder = 2 [(buf.validate.field).string = {
    in: [
      "inbox",
      "archive",
      "sent",
      "drafts",
      "junk",
      "trash"
    ]
  }];
  repeated string add_labels = 3 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  }];
  repeated string remove_labels = 4 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  }];
  // Flags to set or clear: seen false marks the message unread.
  optional bool seen = 5;
  optional bool answered = 6;
  optional bool flagged = 7;
  optional bool draft = 8;
  optional bool forwarded = 9;
}

message UpdateMessageResponse {
  Message message = 1 [(buf.validate.field).required = true];
}

message DeleteMessageRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
  }];
}

message DeleteMessageResponse {}

message GetMessageHeadersRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
  }];
}

message GetMessageHeadersResponse {
  // Every header field exactly as received, in order, including the ones
  // parsed into from, to, cc, subject, and date.
  repeated MessageHeader headers = 1;
}

message GetMessagePartRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
  }];
  // Position in the message's parts, from 0.
  int32 index = 2 [(buf.validate.field).int32 = {
    gte: 0
    lt: 1000
  }];
}

message GetMessagePartResponse {
  // The first message has the content type; later ones only data chunks.
  google.api.HttpBody content = 1 [(buf.validate.field).required = true];
}

message GetMessageRawRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
  }];
  // The first byte to read, from 0. Absent means 0.
  optional int64 offset = 2 [(buf.validate.field).int64.gte = 0];
  // How many bytes to read at most. Absent means to the end.
  optional int64 length = 3 [(buf.validate.field).int64.gte = 1];
}

message GetMessageRawResponse {
  google.api.HttpBody raw = 1 [(buf.validate.field).required = true];
}

message BatchUpdateMessagesRequest {
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 1000
    unique: true
    items: {
      string: {pattern: "^[0-9a-hjkmnp-tv-z]{26}$"}
    }
  }];
  // Moves the messages to this folder.
  optional string folder = 2 [(buf.validate.field).string = {
    in: [
      "inbox",
      "archive",
      "sent",
      "drafts",
      "junk",
      "trash"
    ]
  }];
  repeated string add_labels = 3 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  }];
  repeated string remove_labels = 4 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  }];
  optional bool seen = 5;
  optional bool answered = 6;
  optional bool flagged = 7;
  optional bool draft = 8;
  optional bool forwarded = 9;
}

message BatchUpdateMessagesResponse {
  // How many messages were updated.
  int32 updated = 1;
}

message ListMessagesBySeqRequest {
  // Treated as an address if it contains "@".
  string mailbox_id_or_address = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "mailbox_id_or_address"
      message: "must be a mailbox ID or an email address"
      expression: "this.matches('^[0-9a-hjkmnp-tv-z]{26}$') || this.isEmail()"
    }
  }];
  // What to list: a folder, or a label.
  oneof view {
    option (buf.validate.oneof).required = true;
    string folder = 2 [(buf.validate.field).string = {
      in: [
        "inbox",
        "archive",
        "sent",
        "drafts",
        "junk",
        "trash"
      ]
    }];
    string label = 3 [(buf.validate.field).string = {
      pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
      max_len: 64
    }];
  }
  // The seq of the last message on the previous page.
  optional uint32 after = 4;
  // Absent means 50.
  optional int32 limit = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];
}

message ListMessagesBySeqResponse {
  // A message, with its seq in the folder or label: higher than that of
  // any message that came there before it.
  message Entry {
    uint32 seq = 1 [(google.api.field_behavior) = REQUIRED];
    MessageSummary message = 2 [(google.api.field_behavior) = REQUIRED];
  }
  repeated Entry messages = 1;
  // When seqs here began: the mailbox's creation for a folder, the label's
  // for a label, so a label deleted and created again starts over. Seqs from
  // before mean nothing. IMAP's UIDVALIDITY.
  google.protobuf.Timestamp since = 2 [(google.api.field_behavior) = REQUIRED];
  // Higher than any seq here, now or later. IMAP's UIDNEXT.
  uint32 next_seq = 3 [(google.api.field_behavior) = REQUIRED];
}

message ListChangesRequest {
  // Treated as an address if it contains "@".
  string mailbox_id_or_address = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "mailbox_id_or_address"
      message: "must be a mailbox ID or an email address"
      expression: "this.matches('^[0-9a-hjkmnp-tv-z]{26}$') || this.isEmail()"
    }
  }];
  // The cursor from the last changes. Opaque: pass back what ListChanges
  // returned. Absent means from now: no changes, just the cursor to start
  // from. A sync client takes it before listing a mailbox, so it misses no
  // change made meanwhile.
  string cursor = 2 [(buf.validate.field).string.max_len = 64];
  // How many of the organization's events to read, other mailboxes'
  // included: a page can have fewer changes. Absent means 1000.
  optional int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 5000
  }];
}

message ListChangesResponse {
  // Messages that came into the mailbox since, delivered or restored, in
  // their current state. A client that listed the mailbox after taking the
  // cursor may have them already.
  repeated MessageSummary created = 1;
  // Messages that were there before and changed since, in their current
  // state.
  repeated MessageSummary updated = 2;
  // IDs of messages deleted since, even those created since: a client that
  // listed the mailbox after taking the cursor may have them.
  repeated string deleted = 3;
  // Where these changes end, opaque: pass it as cursor next time.
  string cursor = 4;
  // Whether there are more changes after it already.
  bool has_more = 5;
}
