syntax = "proto3";

package spooly.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/spoolysh/spooly/gen/spooly/v1;spoolyv1";

service LabelService {
  // Create a user label. Admins only: labels are shared by every mailbox.
  rpc CreateLabel(CreateLabelRequest) returns (CreateLabelResponse) {
    option (google.api.http) = {
      post: "/v1/labels"
      body: "*"
      response_body: "label"
    };
  }

  // List labels by name.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/labels"
      response_body: "labels"
    };
  }

  // Delete a user label and remove it from its messages. Admins only.
  rpc DeleteLabel(DeleteLabelRequest) returns (DeleteLabelResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {delete: "/v1/labels/{name}"};
  }
}

// A label says what a message is about, such as billing; a message can
// have several, and keeps them in any folder. Labels are shared by all
// mailboxes. A message's folder says where it is, and its flags its state.
// No label can take a folder's or a flag's name.
message Label {
  // Unique, e.g. "billing".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  ];
  google.protobuf.Timestamp created_at = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

message CreateLabelRequest {
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {
      pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
      max_len: 64
    }
  }];
}

message CreateLabelResponse {
  Label label = 1 [(buf.validate.field).required = true];
}

message ListLabelsRequest {}

message ListLabelsResponse {
  repeated Label labels = 1;
}

message DeleteLabelRequest {
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {
      pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
      max_len: 64
    }
  }];
}

message DeleteLabelResponse {}
