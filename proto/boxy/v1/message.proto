syntax = "proto3";

package boxy.v1;

import "boxy/v1/common.proto";
import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/boxysh/boxy/gen/boxy/v1;boxyv1";

service MessageService {
  // Store an incoming message. Over REST, the body is the raw message
  // (message/rfc822) and other fields go in the query string.
  rpc CreateMessage(stream CreateMessageRequest) returns (CreateMessageResponse) {
    option (google.api.http) = {
      post: "/v1/messages"
      body: "raw"
      response_body: "message"
      additional_bindings: {
        post: "/v1/accounts/{account_id_or_addr}/messages"
        body: "raw"
        response_body: "message"
      }
    };
    option (gnostic.openapi.v3.operation) = {
      parameters: {
        parameter: {
          name: "account_id_or_addr"
          in: "query"
          description: "Account ID or address. Only for POST /v1/messages."
          schema: {
            schema: {type: "string"}
          }
        }
      }
      parameters: {
        parameter: {
          name: "sender"
          in: "query"
          description: "SMTP envelope sender (MAIL FROM)."
          schema: {
            schema: {
              type: "string"
              max_length: 254
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "received_at"
          in: "query"
          description: "When the MTA accepted it. Absent means now."
          schema: {
            schema: {
              type: "string"
              format: "date-time"
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "idempotency_key"
          in: "query"
          description: "Unique per account. A repeat returns the stored message."
          schema: {
            schema: {
              type: "string"
              max_length: 128
            }
          }
        }
      }
      request_body: {
        request_body: {
          required: true
          content: {
            additional_properties: {
              name: "message/rfc822"
              value: {
                schema: {
                  schema: {
                    type: "string"
                    format: "binary"
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // List messages, newest first by ID. A page shorter than limit is the last one.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages"
      response_body: "messages"
      additional_bindings: {
        get: "/v1/accounts/{account_id_or_addr}/messages"
        response_body: "messages"
      }
    };
  }

  // Update a message's labels and metadata. Absent fields are left
  // unchanged. Removing inbox archives a message, removing unread marks it
  // read.
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      patch: "/v1/messages/{id}"
      body: "*"
      response_body: "message"
    };
  }

  // Get a message with its body.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages/{id}"
      response_body: "message"
    };
  }

  // Get a message's raw source.
  rpc GetRawMessage(GetRawMessageRequest) returns (stream GetRawMessageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages/{id}/raw"
      response_body: "raw"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "Raw RFC 5322 source."
              content: {
                additional_properties: {
                  name: "message/rfc822"
                  value: {
                    schema: {
                      schema: {
                        type: "string"
                        format: "binary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Get an attachment's content. Over REST, the body is the attachment, with
  // its content type and a Content-Disposition naming the file.
  rpc GetAttachment(GetAttachmentRequest) returns (stream GetAttachmentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/messages/{id}/attachments/{index}"
      response_body: "content"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "The attachment, decoded."
              content: {
                additional_properties: {
                  name: "application/octet-stream"
                  value: {
                    schema: {
                      schema: {
                        type: "string"
                        format: "binary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }
}

// A stored message. Headers, snippet, size, attachments, and body are parsed
// from the raw source.
message Message {
  // Lowercase ULID.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"}
    }
  ];
  string account_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"}
    }
  ];

  // SMTP envelope sender (MAIL FROM), not the From header. Empty for bounces.
  string sender = 3 [(google.api.field_behavior) = REQUIRED];
  // SMTP envelope recipient (RCPT TO) it was delivered to, e.g.
  // "hello+news@boxy.sh". The account's address when created by account ID.
  string recipient = 4 [(google.api.field_behavior) = REQUIRED];

  // First address of the From header. Empty when there's none.
  Address from = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  repeated Address to = 6 [(google.api.field_behavior) = REQUIRED];
  repeated Address cc = 7 [(google.api.field_behavior) = REQUIRED];
  string subject = 8 [(google.api.field_behavior) = REQUIRED];
  // Date header, as claimed by the sender. Absent when missing or invalid.
  optional google.protobuf.Timestamp date = 9;

  // Start of the text body, for list views.
  string snippet = 10 [(google.api.field_behavior) = REQUIRED];
  // Raw size in bytes.
  int64 size = 11 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gte = 0
  ];
  repeated Attachment attachments = 12 [(google.api.field_behavior) = REQUIRED];
  // Only set by GetMessage.
  optional MessageBody body = 13;

  // Label names. New messages get inbox and unread.
  repeated string labels = 14 [(google.api.field_behavior) = REQUIRED];
  // Your own key-value data, e.g. {"ticket_id": "T-123"}.
  map<string, string> metadata = 15 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).map = {
      max_pairs: 50
      keys: {
        string: {
          min_len: 1
          max_len: 40
        }
      }
      values: {
        string: {max_len: 500}
      }
    }
  ];

  // When the MTA accepted it.
  google.protobuf.Timestamp received_at = 16 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

message MessageBody {
  string text = 1 [(google.api.field_behavior) = REQUIRED];
  // Unsanitized.
  string html = 2 [(google.api.field_behavior) = REQUIRED];
}

message Attachment {
  // Empty when not set.
  string filename = 1 [(google.api.field_behavior) = REQUIRED];
  string content_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
  // In bytes.
  int64 size = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64.gte = 0
  ];
}

// Over Connect/gRPC, the first message carries all fields, later ones
// only raw chunks.
message CreateMessageRequest {
  // Treated as an address if it contains "@"; "local+tag@domain" finds
  // "local@domain". Stored as the message's recipient. Required in the first
  // message.
  string account_id_or_addr = 1 [(buf.validate.field) = {
    ignore: IGNORE_IF_ZERO_VALUE
    cel: {
      id: "account_id_or_addr"
      message: "must be an account ID or an email address"
      expression: "this.matches('^[0-7][0-9a-hjkmnp-tv-z]{25}$') || this.isEmail()"
    }
  }];
  // Raw RFC 5322 source.
  google.api.HttpBody raw = 2 [(buf.validate.field).required = true];
  // SMTP envelope sender (MAIL FROM), e.g. Cloudflare's message.from.
  string sender = 3 [(buf.validate.field).string.max_len = 254];
  // Absent means now.
  optional google.protobuf.Timestamp received_at = 4;
  // Unique per account. A repeat returns the stored message.
  optional string idempotency_key = 5 [(buf.validate.field).string.max_len = 128];
}

message CreateMessageResponse {
  Message message = 1 [(buf.validate.field).required = true];
}

message ListMessagesRequest {
  // Treated as an address if it contains "@". Absent means all accounts.
  optional string account_id_or_addr = 1 [(buf.validate.field).cel = {
    id: "account_id_or_addr"
    message: "must be an account ID or an email address"
    expression: "this.matches('^[0-7][0-9a-hjkmnp-tv-z]{25}$') || this.isEmail()"
  }];
  // Absent means 50.
  optional int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // ID of the last message from the previous page.
  optional string after = 3 [(buf.validate.field).string.pattern = "^[0-7][0-9a-hjkmnp-tv-z]{25}$"];
  // Only list messages with this label.
  optional string label = 4 [(buf.validate.field).string = {
    pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
    max_len: 64
  }];
}

message ListMessagesResponse {
  repeated Message messages = 1;
}

message UpdateMessageRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"}
  }];
  repeated string add_labels = 2 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  }];
  repeated string remove_labels = 3 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        pattern: "^[a-z0-9]+(?:[_-][a-z0-9]+)*$"
        max_len: 64
      }
    }
  }];
  // Merged into the message's metadata. An empty value deletes the key.
  map<string, string> metadata = 4 [(buf.validate.field).map = {
    max_pairs: 50
    keys: {
      string: {
        min_len: 1
        max_len: 40
      }
    }
    values: {
      string: {max_len: 500}
    }
  }];
}

message UpdateMessageResponse {
  Message message = 1 [(buf.validate.field).required = true];
}

message GetMessageRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"}
  }];
}

message GetMessageResponse {
  Message message = 1 [(buf.validate.field).required = true];
}

message GetRawMessageRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"}
  }];
}

message GetRawMessageResponse {
  google.api.HttpBody raw = 1 [(buf.validate.field).required = true];
}

message GetAttachmentRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"}
  }];
  // Position in the message's attachments, from 0.
  int32 index = 2 [(buf.validate.field).int32 = {
    gte: 0
    lt: 1000
  }];
}

message GetAttachmentResponse {
  // The first message has the content type; later ones only data chunks.
  google.api.HttpBody content = 1 [(buf.validate.field).required = true];
}
