syntax = "proto3";

package boxy.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/boxysh/boxy/gen/boxy/v1;boxyv1";

service AccountService {
  // Create an account.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
      response_body: "account"
    };
  }

  // List accounts, newest first by ID. A page shorter than limit is the last one.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/accounts"
      response_body: "accounts"
    };
  }

  // Get an account by ID or address. "local+tag@domain" finds
  // "local@domain".
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/accounts/{id_or_addr}"
      response_body: "account"
    };
  }
}

// An account receives all mail sent to its address.
message Account {
  // Lowercase ULID.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {pattern: "^[0-7][0-9a-hjkmnp-tv-z]{25}$"}
    }
  ];
  // Lowercased, e.g. "hello@boxy.sh".
  string addr = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {
        email: true
        max_len: 254
      }
    }
  ];
  // Empty when not set.
  string name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 128
  ];
  google.protobuf.Timestamp created_at = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

message CreateAccountRequest {
  string addr = 1 [(buf.validate.field) = {
    required: true
    string: {
      email: true
      max_len: 254
    }
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 128];
}

message CreateAccountResponse {
  Account account = 1 [(buf.validate.field).required = true];
}

message ListAccountsRequest {
  // Absent means 50.
  optional int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // ID of the last account from the previous page.
  optional string after = 2 [(buf.validate.field).string.pattern = "^[0-7][0-9a-hjkmnp-tv-z]{25}$"];
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message GetAccountRequest {
  // Treated as an address if it contains "@".
  string id_or_addr = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "id_or_addr"
      message: "must be an account ID or an email address"
      expression: "this.matches('^[0-7][0-9a-hjkmnp-tv-z]{25}$') || this.isEmail()"
    }
  }];
}

message GetAccountResponse {
  Account account = 1 [(buf.validate.field).required = true];
}
