syntax = "proto3";

package boxy.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/boxysh/boxy/gen/boxy/v1;boxyv1";

service AccountService {
  // Create an account. Admins only.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/v1/accounts"
      body: "*"
      response_body: "account"
    };
  }

  // List the accounts you can see, newest first by ID. A page shorter than
  // limit is the last one.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/accounts"
      response_body: "accounts"
    };
  }

  // Get an account by ID or any of its addresses. "local+tag@domain" finds
  // "local@domain".
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/accounts/{id_or_address}"
      response_body: "account"
    };
  }

  // Update an account's name and addresses. Absent fields are left
  // unchanged.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      patch: "/v1/accounts/{id_or_address}"
      body: "*"
      response_body: "account"
    };
  }
}

// An account receives all mail sent to any of its addresses.
message Account {
  // Assigned in order, from 1.
  string id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field) = {
      required: true
      string: {pattern: "^[1-9][0-9]{0,18}$"}
    }
  ];
  // Lowercased, in order, e.g. ["hello@boxy.sh"]. The first is primary:
  // it's shown for the account. Mail to any of them reaches it.
  repeated string addresses = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated.min_items = 1
  ];
  // Empty when not set.
  string name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.max_len = 128
  ];
  google.protobuf.Timestamp created_at = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

message CreateAccountRequest {
  // In order; the first is primary. Each must not belong to another
  // account.
  repeated string addresses = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    unique: true
    items: {
      string: {
        email: true
        max_len: 254
      }
    }
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 128];
}

message CreateAccountResponse {
  Account account = 1 [(buf.validate.field).required = true];
}

message ListAccountsRequest {
  // Absent means 50.
  optional int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // ID of the last account from the previous page.
  optional string after = 2 [(buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message GetAccountRequest {
  // Treated as an address if it contains "@".
  string id_or_address = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "id_or_address"
      message: "must be an account ID or an email address"
      expression: "this.matches('^[1-9][0-9]{0,18}$') || this.isEmail()"
    }
  }];
}

message GetAccountResponse {
  Account account = 1 [(buf.validate.field).required = true];
}

message UpdateAccountRequest {
  // Treated as an address if it contains "@".
  string id_or_address = 1 [(buf.validate.field) = {
    required: true
    cel: {
      id: "id_or_address"
      message: "must be an account ID or an email address"
      expression: "this.matches('^[1-9][0-9]{0,18}$') || this.isEmail()"
    }
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 128];
  // Replaces the account's addresses, in order: the first is primary.
  // Each must not belong to another account. Empty leaves them unchanged.
  repeated string addresses = 3 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        email: true
        max_len: 254
      }
    }
  }];
}

message UpdateAccountResponse {
  Account account = 1 [(buf.validate.field).required = true];
}
